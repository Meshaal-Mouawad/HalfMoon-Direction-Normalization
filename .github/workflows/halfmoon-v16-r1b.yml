name: HalfMoon V16 - close only R1-B paired-contrast sentence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halfmoon-v16-r1b.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create V16 from frozen V15 with single complete-sentence layout protection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess, re, difflib
          base=Path('submission')
          old=base/'PRL_V15_Final'
          new=base/'PRL_V16_Final'
          assert old.is_dir()
          assert not new.exists(), 'V16 already present'
          original=old/'Editable_LaTeX/one_bit_experiment.tex'
          expected_sha='098d00df5361d9819c703665e20081768bb6b9ac'
          got=subprocess.check_output(['git','hash-object',str(original)],text=True).strip()
          assert got==expected_sha, f'V15 source unexpected: {got}'

          shutil.copytree(old/'Editable_LaTeX',new/'Editable_LaTeX')
          shutil.copytree(old/'Figures',new/'Figures')
          (new/'Journal_Upload').mkdir(parents=True,exist_ok=True)
          (new/'Verification').mkdir(parents=True,exist_ok=True)

          old_text=original.read_text()
          old_sentence=(r'The paired contrasts $B-D_M$ and $B-P_M$ formed a separate '
                        r'two-comparison\vadjust{\nobreak} family with simultaneous '
                        r'95\% Bonferroni-adjusted intervals.')
          new_sentence=(r'\par\begin{samepage}'+'\n'
                        +r'\noindent The paired contrasts $B-D_M$ and $B-P_M$ formed a separate '
                        r'two-comparison family with simultaneous 95\% Bonferroni-adjusted intervals.'
                        +'\n'+r'\end{samepage}')
          assert old_text.count(old_sentence)==1, 'Missing/duplicate original R1-B passage'
          revised=old_text.replace(old_sentence,new_sentence,1)
          def strip_layout(s):
              for ctl in [r'\vadjust{\nobreak}',r'\par',r'\begin{samepage}',r'\end{samepage}',r'\noindent']:
                  s=s.replace(ctl,' ')
              return ' '.join(s.split())
          assert strip_layout(old_text)==strip_layout(revised), 'Scientific text must remain exactly the same'
          (new/'Editable_LaTeX/one_bit_experiment.tex').write_text(revised)
          diff=''.join(difflib.unified_diff(old_text.splitlines(True),revised.splitlines(True),
                  fromfile='V15/one_bit_experiment.tex',tofile='V16/one_bit_experiment.tex'))
          (new/'Verification/V15_to_V16_Source.diff').write_text(diff)
          (new/'Verification/V16_Change_Log.md').write_text(
              '# V16 — R1-B layout-only closure\n'
              'Original V15 defect: the words "The paired contrasts" were left on page 5 while the rest of the Methods sentence appeared below Tables 1–2 on page 6.\n'
              'V16 action: start a protected samepage paragraph at the beginning of this one sentence; end the protected block immediately after "intervals.".\n'
              'No words, citations, formulae, numerical values, figures, experiments, disclosures, or supplementary material changed.\n'
              'V15 is preserved unchanged.\n'
          )
          for f in (old/'Editable_LaTeX').rglob('*'):
              if f.is_file() and f.name!='one_bit_experiment.tex' and f.suffix in ('.tex','.bib','.sty','.cls','.py','.sh'):
                  g=new/'Editable_LaTeX'/f.relative_to(old/'Editable_LaTeX')
                  assert f.read_bytes()==g.read_bytes(), f'Protected source modified: {f}'
          print('PASS: V16 source differs from V15 only by one local nonbreaking Methods sentence control')
          PY

      - name: Compile LaTeX from finalized V16 source
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3
            cd submission/PRL_V16_Final/Editable_LaTeX
            bash build.sh > ../Verification/V16_Build.log 2>&1 || {
              tail -100 ../Verification/V16_Build.log
              exit 1
            }

      - name: Audit exact rendered sentence, 7-page limit, preservation and submission package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y poppler-utils
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, shutil, subprocess, zipfile
          old=Path('submission/PRL_V15_Final')
          new=Path('submission/PRL_V16_Final')
          src=new/'Editable_LaTeX'
          up=new/'Journal_Upload'
          ver=new/'Verification'
          pdf=src/'Manuscript.pdf'
          def get_pages(p):
              x=subprocess.check_output(['pdfinfo',str(p)],text=True)
              return int(re.search(r'^Pages:\s*(\d+)',x,re.M).group(1))
          def get_page(n):
              return subprocess.check_output(['pdftotext','-f',str(n),'-l',str(n),'-layout',str(pdf),'-'],text=True)
          assert get_pages(pdf)==7,'Seven-page PRL limit exceeded'
          assert get_pages(src/'Supplement.pdf')==18
          assert get_pages(src/'Threshold_Addendum.pdf')==3
          pages=[get_page(n) for n in range(1,8)]
          positions=[i for i,p in enumerate(pages,1) if 'The paired contrasts' in p]
          assert len(positions)==1, ('The paired contrasts occurrence not unique',positions)
          position=positions[0]
          p=pages[position-1]
          for part in ('The paired contrasts','two-comparison','family with simultaneous','95%','Bonferroni','intervals.'):
              assert part in p, ('R1-B incomplete on same page',position,part)
          assert 'The paired contrasts' not in pages[position-2] if position>1 else True
          # Explicit R1-A and prior closed findings retained.
          intro_optim=[n for n,s in enumerate(pages,1) if 'Full-batch Adam' in s]
          optim_end=[n for n,s in enumerate(pages,1) if 'and learning rates' in s]
          assert intro_optim==optim_end and len(intro_optim)==1,('Optimizer sentence split',intro_optim,optim_end)
          a=[n for n,s in enumerate(pages,1) if 'Every candidate executed' in s]
          b=[n for n,s in enumerate(pages,1) if '4,000 updates' in s]
          assert a==b and len(a)==1,('Training sentence split',a,b)
          assert 'Writing' in pages[3] and '(9)' in pages[3], 'P1 reopened'
          assert 'descriptive associations' in ''.join(pages)
          assert 'Oehler and Gray' in ''.join(pages)
          assert 'During preparation of this work' in ''.join(pages)
          for token in ('54,362','500,000','10.7479','0.0205','0.00119','257','321'):
              assert token in ''.join(pages),f'Protected result missing: {token}'
          # Verify source identity from V15 except exact local layout directives.
          for f in (old/'Editable_LaTeX').rglob('*'):
              if f.is_file() and f.suffix in ('.tex','.bib','.cls','.sty','.sh','.py'):
                  g=src/f.relative_to(old/'Editable_LaTeX')
                  if f.name!='one_bit_experiment.tex':
                      assert f.read_bytes()==g.read_bytes(), f'Unexpected source edit: {f}'
          for f in (old/'Figures').rglob('*'):
              if f.is_file():
                  assert f.read_bytes()==(new/'Figures'/f.relative_to(old/'Figures')).read_bytes()
          for n,s in enumerate(pages,1):
              (ver/f'V16_Page_{n}_Text.txt').write_text(s)
              subprocess.run(['pdftoppm','-f',str(n),'-l',str(n),'-r','120',
                  '-singlefile','-png',str(pdf),str(ver/f'V16_Page_{n}')],check=True,stdout=subprocess.DEVNULL)
          shutil.copy2(pdf,up/'Manuscript.pdf')
          for name in ('Supplement.pdf','Threshold_Addendum.pdf','Highlights.docx','Cover_Letter.pdf','Graphical_Abstract.png'):
              original=old/'Journal_Upload'/name
              assert original.is_file()
              shutil.copy2(original,up/name)
              assert original.read_bytes()==(up/name).read_bytes()
          # The submitted source archive must contain exact compiling V16 source.
          with zipfile.ZipFile(up/'LaTeX_Source.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(src.rglob('*')):
                  if f.is_file() and f.suffix in ('.tex','.bib','.cls','.sty','.py','.sh'):
                      z.write(f,arcname='Manuscript/'+str(f.relative_to(src)))
              for f in sorted((new/'Figures').rglob('*')):
                  if f.is_file():
                      z.write(f,arcname='Figures/'+str(f.relative_to(new/'Figures')))
          with zipfile.ZipFile(up/'LaTeX_Source.zip') as z:
              assert z.testzip() is None
              assert 'Manuscript/one_bit_experiment.tex' in z.namelist()
          filenames=['Manuscript.pdf','Supplement.pdf','Threshold_Addendum.pdf','LaTeX_Source.zip','Highlights.docx','Graphical_Abstract.png','Cover_Letter.pdf']
          checksums=[hashlib.sha256((up/f).read_bytes()).hexdigest()+'  Journal_Upload/'+f for f in filenames]
          (ver/'V16_SHA256SUMS.txt').write_text('\n'.join(checksums)+'\n')
          result=[
              'HalfMoon V16 — R1-B targeted production closure',
              '7-page manuscript: PASS',
              'R1-B complete paired-contrast sentence together: PASS (page '+str(position)+')',
              'R1-A complete optimizer sentence: PASS (page '+str(intro_optim[0])+')',
              'R1-A complete training-update sentence: PASS (page '+str(a[0])+')',
              'E1/E2 citation precision: unchanged from approved V15',
              'P1 Equation (9) introduction: still on page 4',
              'Scientific source text, equations, reported results and figures: PRESERVED',
              '18-page mathematical supplement: identical original PDF from V15',
              '3-page Threshold Addendum: identical original PDF from V15',
              'All 7 manuscript pages rasterized for inspection',
              'Highlights, graphical abstract and cover letter: identical to V15',
              'Editable LaTeX source archive: ZIP CRC PASS',
              'Signed Confirmation of Authorship: NOT INCLUDED',
              'Journal resubmission: NOT PERFORMED'
          ]
          (ver/'V16_Production_Results.txt').write_text('\n'.join(result)+'\n')
          readme=(
              'Half-Moon PRL V16 journal-upload delivery package\n'
              'Title: Global loss bounds and one-bit recovery for direction-normalized half-moons\n'
              'Existing journal record: PRLETTERS-D-26-03032\n'
              'Corrected one remaining V15 float interruption (R1-B), no scientific edits.\n'
              'Extract this ZIP and upload individual Journal_Upload/ files to Editorial Manager.\n'
              'Signed Confirmation of Authorship is a separate required author file, not included.\n'
              'No journal submission has been performed from this build.\n'
          )
          archive=new/'HalfMoon_PRL_V16_EditorialManager_Submission.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.writestr('README_FIRST.txt',readme)
              z.write(ver/'V16_Production_Results.txt','V16_Production_Results.txt')
              z.write(ver/'V16_SHA256SUMS.txt','SHA256SUMS.txt')
              z.write(ver/'V16_Change_Log.md','V16_Change_Log.md')
              for filename in filenames:
                  z.write(up/filename,arcname='Journal_Upload/'+filename)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None and len(z.namelist())==11
              for filename in filenames:
                  assert z.read('Journal_Upload/'+filename)==(up/filename).read_bytes()
          checksum=hashlib.sha256(archive.read_bytes()).hexdigest()
          (new/'PACKAGE_SHA256.txt').write_text(checksum+'  '+archive.name+'\n')
          print('\n'.join(result))
          print('OUTER_ARCHIVE_SHA256:',checksum,'BYTES:',archive.stat().st_size)
          PY

      - name: Commit verified isolated V16 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A submission/PRL_V16_Final
          git diff --cached --name-only | grep -v '^submission/PRL_V16_Final/' && exit 1 || true
          git diff --cached --quiet && { echo 'No V16 artifacts found'; exit 1; }
          git commit -m "Deliver Half-Moon V16 with fully protected paired-contrast sentence"
          git push origin HEAD:main
