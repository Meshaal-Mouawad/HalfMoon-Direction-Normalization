name: PRL authorship official single-page prefill
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prl-authorship-prefill-once.yml'
permissions:
  contents: write
jobs:
  prefill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fill the journal's original one-page form; leave signature and date blank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install --break-system-packages pymupdf
          python3 - <<'PY'
          import fitz, pathlib, hashlib
          base=pathlib.Path('submission/PRL_V16_Final/Author_Forms')
          original=base/'PRLETTERS-D-26-03032_Official_Authorship_Confirmation_Blank.pdf'
          output=base/'PRLETTERS-D-26-03032_Authorship_Confirmation_Prefilled_To_Sign.pdf'
          preview=base/'PRLETTERS-D-26-03032_Authorship_Confirmation_Preview.png'
          assert original.is_file(), 'Official Elsevier source missing'
          doc=fitz.open(str(original))
          assert len(doc)==1,'Only page 1 of official form permitted'
          page=doc[0]
          before=page.get_text()
          assert 'Authorship Confirmation' in before
          assert 'As corresponding author I,' in before
          assert 'List any pre-prints:' in before
          assert 'Relevant Conference publication(s)' in before
          assert 'Justification for re-publication:' in before
          assert 'Signature' in before
          print('ORIGINAL_PAGE_SIZE',page.rect)
          for b in page.get_text('dict')['blocks']:
            if b.get('type')!=0:continue
            for line in b['lines']:
              t=''.join(span['text'] for span in line['spans'])
              if any(k in t for k in ('As corresponding author','that:','List any pre-prints:','Relevant Conference','Justification for re-publication','Signature','Date')):
                print('ORIGINAL_LINE',repr(t),'BBOX',line['bbox'],'SPANS',[(s['font'],s['size']) for s in line['spans']])

          # Replace only the existing corresponding-author introduction line.
          lines=[]
          for b in page.get_text('dict')['blocks']:
            if b.get('type')!=0:continue
            for line in b['lines']:
              t=''.join(s['text'] for s in line['spans'])
              if 'As corresponding author I,' in t:
                lines.append((fitz.Rect(line['bbox']),line))
          assert len(lines)==1,('Unexpected corresponding-author line count',len(lines))
          r,line=lines[0]
          original_font=line['spans'][0]['size']
          new_line='As corresponding author I, Meshaal Mouawad, hereby confirm on behalf of all authors'
          x=r.x0
          right=min(page.rect.width-38,r.x0+page.rect.width*0.82)
          font='tiro'
          fontsize=min(original_font,10.3)
          while fitz.get_text_length(new_line,fontname=font,fontsize=fontsize)>right-x and fontsize>8.0:
            fontsize-=0.2
          assert fitz.get_text_length(new_line,fontname=font,fontsize=fontsize)<right-x, 'Name cannot fit'
          page.add_redact_annot(fitz.Rect(r.x0-1,r.y0-1,right,r.y1+1),fill=(1,1,1))
          page.apply_redactions(images=0,graphics=0,text=0)
          page.insert_text((x,r.y1-1),new_line,fontname=font,fontsize=fontsize,color=(0,0,0))

          def add_value(label,value,below=False):
            matches=page.search_for(label)
            assert len(matches)==1,(label,matches)
            rect=matches[0]
            if below:
              px,py=rect.x0,rect.y1+14
            else:
              px,py=rect.x1+8,rect.y1-1
            assert px+fitz.get_text_length(value,fontname='tiro',fontsize=10)<page.rect.width-24
            page.insert_text((px,py),value,fontname='tiro',fontsize=10,color=(0,0,0))
            print('FIELD',label,'VALUE',value,'POS',(px,py))
          add_value('List any pre-prints:','None')
          add_value('Relevant Conference publication(s) (submitted, accepted, or published):','None',below=True)
          add_value('Justification for re-publication:','N/A')
          doc.set_metadata({'title':'Pattern Recognition Letters - Authorship Confirmation',
              'subject':'PRLETTERS-D-26-03032 - corresponding author prefilled; signature pending',
              'author':'Meshaal Mouawad'})
          doc.save(str(output),garbage=4,deflate=True)
          doc.close()
          chk=fitz.open(str(output))
          assert len(chk)==1
          t=chk[0].get_text()
          for key in ('Authorship Confirmation','Meshaal Mouawad','None','N/A','Signature','Date','Justification for re-publication'):
            assert key in t,('missing',key)
          for bad in ('Graphical Abstract (Optional)','Research Highlights (Required)','Type the title of your paper'):
            assert bad not in t,('unwanted template',bad)
          assert t.count('None')==2,('unexpected field values',t)
          pix=chk[0].get_pixmap(matrix=fitz.Matrix(1.6,1.6),alpha=False)
          pix.save(str(preview))
          print('PASS: Original journal form, one page, filled author/preprint/conference/justification, signature blank')
          print('SHA256',hashlib.sha256(output.read_bytes()).hexdigest(),'BYTES',output.stat().st_size)
          PY
      - name: Commit the standalone ready-to-sign PDF and inspection image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/PRL_V16_Final/Author_Forms/PRLETTERS-D-26-03032_Authorship_Confirmation_Prefilled_To_Sign.pdf
          git add submission/PRL_V16_Final/Author_Forms/PRLETTERS-D-26-03032_Authorship_Confirmation_Preview.png
          git commit -m "Prepare official PRL authorship form for author signature only"
          git push origin HEAD:main
