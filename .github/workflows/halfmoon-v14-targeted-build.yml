name: Build Half-Moon V14 after three targeted editorial corrections
on:
  push:
    branches: [main]
    paths: ['.github/workflows/halfmoon-v14-targeted-build.yml']
permissions:
  contents: write
jobs:
  v14:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze V13 and apply exactly E1, E2, P1 in separate V14 directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, shutil, difflib
          old=Path('submission/PRL_V11_Final')
          new=Path('submission/PRL_V14_Final')
          assert not new.exists(), 'V14 directory already exists'
          assert (old/'Editable_LaTeX/narrative_sections.tex').is_file()
          assert (old/'Editable_LaTeX/theory_main.tex').is_file()
          expected={
            'narrative_sections.tex':'df9ff2854011ddba2f74147623a2396ca9212748',
            'theory_main.tex':'a51fbb33e25dcea083ab06a18447c5916dafca28'
          }
          import subprocess
          for f,sha in expected.items():
              source=old/'Editable_LaTeX'/f
              assert subprocess.check_output(['git','hash-object',str(source)],text=True).strip()==sha, f'Source baseline differs: {f}'
          shutil.copytree(old/'Editable_LaTeX',new/'Editable_LaTeX')
          shutil.copytree(old/'Figures',new/'Figures')
          (new/'Journal_Upload').mkdir(parents=True)
          (new/'Verification').mkdir(parents=True)

          narrative=(old/'Editable_LaTeX/narrative_sections.tex').read_text()
          e1_old=r'Poblete et al.~\citep{Poblete2026} compare downstream decision rules on fixed generative embeddings across eight datasets, showing that rule ranking depends on feature geometry.'
          e1_new=r'Poblete et al.~\citep{Poblete2026} compare downstream classifiers on fixed representations across eight datasets. They report variation in classifier rankings and descriptive associations with representation geometry.'
          e2_old=r'Finally, decision-aware quantization provides precedent for preserving labels with compressed inputs \citep{OehlerGray1995,Senozan2024}; our repair establishes that one common radial bit, combined with direction, preserves the decision throughout a specified continuous class support.'
          e2_new=r'Finally, Oehler and Gray~\citep{OehlerGray1995} study classification-aware vector quantization, and \citet{Senozan2024} study supervised discretization for classification. Our construction proves exact decision preservation with one shared radial bit and direction on the specified continuous support.'
          for label,old_str in [('E1',e1_old),('E2',e2_old)]:
              assert narrative.count(old_str)==1, f'Non-unique/missing {label} original'
          revised=narrative.replace(e1_old,e1_new,1).replace(e2_old,e2_new,1)
          (new/'Editable_LaTeX/narrative_sections.tex').write_text(revised)
          theory=(old/'Editable_LaTeX/theory_main.tex').read_text()
          p1_old=r'both cores lie within distance $M$ of $p$. Writing $\kappa=\min(\kappa_+,\kappa_-)$ gives'+'\n'+r'\begin{equation}'
          p1_new=r'both cores lie within distance $M$ of $p$.'+'\n'+r'\par\begin{samepage}'+'\n'+r'\noindent Writing $\kappa=\min(\kappa_+,\kappa_-)$ gives'+'\n'+r'\begin{equation}'
          close_old=r'\label{eq:constructive-global}'+'\n'+r'\end{equation}'+'\n'+'For bounded origins,'
          close_new=r'\label{eq:constructive-global}'+'\n'+r'\end{equation}'+'\n'+r'\end{samepage}'+'\n'+'For bounded origins,'
          assert theory.count(p1_old)==1 and theory.count(close_old)==1, 'P1 original not unique'
          changed=theory.replace(p1_old,p1_new,1).replace(close_old,close_new,1)
          (new/'Editable_LaTeX/theory_main.tex').write_text(changed)
          pat=re.compile(r'\\begin\{(?:equation|align)\}.*?\\end\{(?:equation|align)\}',re.S)
          assert pat.findall(theory)==pat.findall(changed), 'Protected theorem formulas modified'
          for f in (old/'Editable_LaTeX').rglob('*'):
              if f.is_file() and f.name not in expected:
                  pair=new/'Editable_LaTeX'/f.relative_to(old/'Editable_LaTeX')
                  assert f.read_bytes()==pair.read_bytes(), f'Protected file differs: {f}'
          edits=[]
          for name,before,after in [('narrative_sections.tex',narrative,revised),('theory_main.tex',theory,changed)]:
              edits.extend(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='V13/'+name,tofile='V14/'+name))
          (new/'Verification/V13_to_V14_Source.diff').write_text(''.join(edits))
          (new/'Verification/V14_Editorial_Change_Log.md').write_text(
            '# V14 targeted editorial closure\n'
            'E1: Poblete et al. ranking variation and geometric associations identified as descriptive.\n'
            'E2: Oehler/Gray and Senozan/Soylu attributed classification-aware quantization/discretization, without overclaiming exact preservation.\n'
            'P1: split the certificate lead-in into a samepage introduction and unchanged Equation (9).\n'
            'V13 original directory was preserved. The only manuscript-source changes are narrative_sections.tex and theory_main.tex.\n'
            'Protected equation environments were compared character-for-character against the V13 baseline.\n'
          )
          print('PASS: exact E1/E2/P1 modifications with protected equations unchanged')
          PY

      - name: Compile V14 main article and all supplements in full TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3
            cd submission/PRL_V14_Final/Editable_LaTeX
            bash build.sh > ../Verification/V14_Build.log 2>&1 || {
              tail -100 ../Verification/V14_Build.log
              exit 1
            }

      - name: Verify pagination, review wording, unchanged supplemental science, and package ZIP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y poppler-utils
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib, zipfile, shutil, io, re, struct
          old=Path('submission/PRL_V11_Final')
          new=Path('submission/PRL_V14_Final')
          edit=new/'Editable_LaTeX'
          up=new/'Journal_Upload'
          verify=new/'Verification'
          original=old/'Journal_Upload'
          def pages(p):
              out=subprocess.check_output(['pdfinfo',str(p)],text=True)
              return int(re.search(r'^Pages:\s+(\d+)',out,re.M).group(1))
          assert pages(edit/'Manuscript.pdf')==7,'V14 main article exceeds 7 pages'
          assert pages(edit/'Supplement.pdf')==18,'Supplement changed page count'
          assert pages(edit/'Threshold_Addendum.pdf')==3,'Threshold Addendum changed page count'
          # PDF metadata and producer timestamps may change on recompilation.
          # Compare the extracted scientific content, then retain the original
          # frozen supplement/addendum PDF bytes in the V14 delivery.
          for name in ['Supplement.pdf','Threshold_Addendum.pdf']:
              built=edit/name
              frozen=old/'Journal_Upload'/name
              def pdf_text(p):
                  return subprocess.check_output(['pdftotext','-layout',str(p),'-'])
              assert pdf_text(built)==pdf_text(frozen), f'Supplement rendered text changed: {name}'
              shutil.copy2(frozen,built)
              assert built.read_bytes()==frozen.read_bytes(),f'Could not preserve frozen artifact: {name}'
          text= subprocess.check_output(['pdftotext','-layout',str(edit/'Manuscript.pdf'),'-'],text=True)
          assert 'descriptive associations' in text or 'descriptive' in text
          assert 'Oehler and Gray' in text
          allpage=[]
          for n in range(1,8):
              s=subprocess.check_output(['pdftotext','-f',str(n),'-l',str(n),'-layout',str(edit/'Manuscript.pdf'),'-'],text=True)
              allpage.append(s)
              (verify/f'V14_Page_{n}_Text.txt').write_text(s)
          candidate=[]
          for k,s in enumerate(allpage,1):
              if 'Writing' in s and 'gives' in s and '(9)' in s:
                  candidate.append(k)
          assert len(candidate)==1, f'P1 still split from Equation 9; matched pages {candidate}'
          assert 'gives' not in allpage[3][:150], 'P1 still orphaned at start of page 4'
          assert not any(x in text for x in ['??','LaTeX Error'])
          assert 'Theorem 1: loss at every finite origin.' in text
          assert '54,362' in text and 'three' in text
          print('Equation 9 lead-in and equation co-located on page',candidate[0])

          for n in [2,3,4]:
              stem=verify/f'V14_Page_{n}'
              subprocess.run(['pdftoppm','-f',str(n),'-l',str(n),'-r','115','-singlefile','-png',str(edit/'Manuscript.pdf'),str(stem)],check=True)
          shutil.copy2(edit/'Manuscript.pdf',up/'Manuscript.pdf')
          shutil.copy2(edit/'Supplement.pdf',up/'Supplement.pdf')
          shutil.copy2(edit/'Threshold_Addendum.pdf',up/'Threshold_Addendum.pdf')
          for name in ['Cover_Letter.pdf','Highlights.docx','Graphical_Abstract.png']:
              shutil.copy2(original/name,up/name)
              assert (up/name).read_bytes()==(original/name).read_bytes(),f'Protected ancillary file changed: {name}'
          zname=up/'LaTeX_Source.zip'
          with zipfile.ZipFile(zname,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(edit.rglob('*')):
                  if f.is_file() and f.suffix in ['.tex','.bib','.cls','.sty','.sh','.py']:
                      z.write(f,arcname='Manuscript/'+str(f.relative_to(edit)))
              for f in sorted((new/'Figures').rglob('*')):
                  if f.is_file():
                      z.write(f,arcname='Figures/'+str(f.relative_to(new/'Figures')))
          with zipfile.ZipFile(zname) as z:
              assert z.testzip() is None
              entries=z.namelist()
              assert 'Manuscript/Manuscript.tex' in entries and 'Manuscript/references.bib' in entries
              assert 'Manuscript/narrative_sections.tex' in entries and 'Manuscript/theory_main.tex' in entries
          summary=[
              'V14 PRL targeted corrections build: PASS',
              'E1 source correction: PASS',
              'E2 source correction: PASS',
              f'P1 equation lead-in and Equation (9) same page: PASS (page {candidate[0]})',
              'Main manuscript page count: 7',
              'Supplement page count: 18 (byte-identical to V13)',
              'Threshold addendum page count: 3 (byte-identical to V13)',
              'Frozen theorem equations: PASS (source equality)',
              'Cover letter, highlights, graphical abstract: byte-identical to V13',
              'Source ZIP: integrity PASS',
              'Editorial Manager upload: NOT PERFORMED',
              'Signed Confirmation of Authorship: not in repository'
          ]
          checks=[]
          files=['Manuscript.pdf','Supplement.pdf','Threshold_Addendum.pdf','LaTeX_Source.zip','Highlights.docx','Graphical_Abstract.png','Cover_Letter.pdf']
          for name in files:
              f=up/name
              checks.append(hashlib.sha256(f.read_bytes()).hexdigest()+'  Journal_Upload/'+name)
          (verify/'V14_SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
          (verify/'V14_Production_Results.txt').write_text('\n'.join(summary)+'\n')
          readme=(
              'Half-Moon V14 PRL journal upload (existing manuscript PRLETTERS-D-26-03032)\n'
              'Author: Meshaal Mouawad\n'
              'Only editorial corrections E1, E2, P1 were applied to the main article.\n'
              'Seven-page revised Manuscript.pdf; 18-page Supplement.pdf; 3-page Threshold_Addendum.pdf.\n'
              'The ZIP is a transfer container; extract and upload its Journal_Upload files individually.\n'
              'The signed Confirmation of Authorship is absent from this archive and must be uploaded separately.\n'
              'No Editorial Manager portal operation or resubmission has been performed.\n'
          )
          pack=new/'HalfMoon_PRL_V14_EditorialManager_Submission.zip'
          with zipfile.ZipFile(pack,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.writestr('README_FIRST.txt',readme)
              z.write(verify/'V14_Production_Results.txt','V14_Production_Results.txt')
              z.write(verify/'V14_SHA256SUMS.txt','SHA256SUMS.txt')
              z.write(verify/'V14_Editorial_Change_Log.md','V14_Editorial_Change_Log.md')
              for name in files:
                  z.write(up/name,'Journal_Upload/'+name)
          with zipfile.ZipFile(pack) as z:
              assert z.testzip() is None
              assert len(z.namelist())==11
              for name in files:
                  assert z.read('Journal_Upload/'+name)==(up/name).read_bytes()
          digest=hashlib.sha256(pack.read_bytes()).hexdigest()
          (new/'PACKAGE_SHA256.txt').write_text(f'{digest}  {pack.name}\n')
          print('\n'.join(summary))
          print('V14 archive SHA256:',digest,'bytes:',pack.stat().st_size)
          PY

      - name: Publish V14 as a new version; preserve all V13 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A submission/PRL_V14_Final
          git diff --cached --quiet && { echo 'ERROR: no V14 changes staged'; exit 1; }
          git diff --cached --name-only | grep -v '^submission/PRL_V14_Final/' && { echo 'ERROR: attempted change outside V14'; exit 1; } || true
          git commit -m "Prepare validated Half-Moon V14 with E1 E2 P1 only"
          git push origin HEAD:main
