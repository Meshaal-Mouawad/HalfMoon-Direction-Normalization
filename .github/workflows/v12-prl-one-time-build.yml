name: One-time V12 Pattern Recognition Letters build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12-prl-one-time-build.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build all three documents in complete TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3
            cd submission/PRL_V11_Final/Editable_LaTeX
            bash build.sh > ../Verification/V12_Build.log 2>&1 || {
              tail -150 ../Verification/V12_Build.log
              exit 1
            }
      - name: Verify pages, source and upload package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y poppler-utils rsync zip
          BASE=submission/PRL_V11_Final
          EDIT="$BASE/Editable_LaTeX"
          UP="$BASE/Journal_Upload"
          PAGES_MAIN=$(pdfinfo "$EDIT/Manuscript.pdf" | awk '/^Pages:/ {print $2}')
          PAGES_SUPP=$(pdfinfo "$EDIT/Supplement.pdf" | awk '/^Pages:/ {print $2}')
          PAGES_ADD=$(pdfinfo "$EDIT/Threshold_Addendum.pdf" | awk '/^Pages:/ {print $2}')
          printf 'Pages: main=%s supplement=%s addendum=%s\n' "$PAGES_MAIN" "$PAGES_SUPP" "$PAGES_ADD"
          test "$PAGES_MAIN" -le 7 || {
            echo "FAIL: PRL initial main article exceeds seven-page limit"
            exit 1
          }
          test "$PAGES_MAIN" -ge 6
          test "$PAGES_SUPP" -ge 18
          test "$PAGES_ADD" -ge 3
          grep -Fq "Bayes risks" "$EDIT/theory_main.tex"
          grep -Fq "54,362" "$EDIT/one_bit_experiment.tex"
          grep -Fq "10.7479" "$EDIT/experimental_sections.tex"
          grep -Fq "public V11 research release" "$EDIT/Manuscript.tex"
          for name in Manuscript Supplement Threshold_Addendum; do
            cp "$EDIT/$name.pdf" "$UP/$name.pdf"
            cmp -s "$EDIT/$name.pdf" "$UP/$name.pdf"
          done
          mkdir -p "$RUNNER_TEMP/V12_source/Manuscript" "$RUNNER_TEMP/V12_source/Figures"
          rsync -a --exclude='*.aux' --exclude='*.log' --exclude='*.blg' --exclude='*.abs' --exclude='*.pdf' --exclude='*.out' --exclude='*.synctex*' "$EDIT/" "$RUNNER_TEMP/V12_source/Manuscript/"
          rsync -a "$BASE/Figures/" "$RUNNER_TEMP/V12_source/Figures/"
          rm -f "$UP/LaTeX_Source.zip"
          (cd "$RUNNER_TEMP/V12_source" && zip -q -r "$GITHUB_WORKSPACE/$UP/LaTeX_Source.zip" Manuscript Figures)
          unzip -tq "$UP/LaTeX_Source.zip" >/dev/null
          (cd "$UP" && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum) > "$BASE/Verification/SHA256SUMS.txt"
          cat > "$BASE/Verification/V12_Production_Results.txt" <<EOF
          V12 clean-build verification
          Source: GitHub Actions complete TeX Live
          Main article pages: $PAGES_MAIN (limit 7)
          Supplement pages: $PAGES_SUPP
          Threshold addendum pages: $PAGES_ADD
          Build script: PASS
          Source ZIP integrity: PASS
          Submission PDFs copied byte-identically from build: PASS
          Scientific results: frozen unchanged
          Final PDF visual inspection: PENDING
          Editorial portal resubmission: NOT PERFORMED
          EOF
          cat > "$BASE/FINAL_STATUS.txt" <<EOF
          V12 revised manuscript for PRLETTERS-D-26-03032
          Main PDF: $PAGES_MAIN pages, freshly built.
          Supplement: $PAGES_SUPP pages, freshly built.
          Threshold Addendum: $PAGES_ADD pages, freshly built.
          LaTeX Source: rebuilt and ZIP integrity checked.
          Full original research archives preserved in public V11 release.
          Signed authorship confirmation must be uploaded under Cover letter.
          Visual review of generated PDF and editor approval remain author actions.
          EOF
      - name: Publish rebuilt journal files on the existing main branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/v12-prl-one-time-build.yml
          git add -A -- submission/PRL_V11_Final .github/workflows/v12-prl-one-time-build.yml
          git diff --cached --quiet && { echo "No build changes"; exit 1; }
          git commit -m "Verify V12 PRL build and synchronize submission PDF and LaTeX"
          git push origin HEAD:main
      - name: Preserve compiled upload files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: V12-Pattern-Recognition-Letters-Submission
          path: submission/PRL_V11_Final/Journal_Upload/
