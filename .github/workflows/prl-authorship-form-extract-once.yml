name: PRL - extract official authorship form only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prl-authorship-form-extract-once.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download Elsevier official PDF and extract only page 1
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y poppler-utils
          mkdir -p submission/PRL_V16_Final/Author_Forms
          curl --fail --location --retry 3 --max-time 90 \
            "https://legacyfileshare.elsevier.com/promis_misc/patrec-authorship-and-formatting.pdf" \
            -o /tmp/prl_official_full.pdf
          pdfinfo /tmp/prl_official_full.pdf | grep Pages
          pdfseparate -f 1 -l 1 /tmp/prl_official_full.pdf /tmp/prl_form_%d.pdf
          f="submission/PRL_V16_Final/Author_Forms/PRLETTERS-D-26-03032_Official_Authorship_Confirmation_Blank.pdf"
          cp /tmp/prl_form_1.pdf "$f"
          test "$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext "$f" /tmp/prl_form.txt
          grep -q 'Authorship Confirmation' /tmp/prl_form.txt
          grep -q 'Signature' /tmp/prl_form.txt
          if grep -Eiq 'Graphical Abstract|Research Highlights|Type the title of your paper' /tmp/prl_form.txt; then
            echo 'ERROR: unrelated templates found in the single-page form'
            exit 1
          fi
          sha256sum "$f"
      - name: Publish only unsigned original page 1 to repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/PRL_V16_Final/Author_Forms/PRLETTERS-D-26-03032_Official_Authorship_Confirmation_Blank.pdf
          git commit -m "Provide official PRL one-page authorship form for author signature"
          git push origin HEAD:main
