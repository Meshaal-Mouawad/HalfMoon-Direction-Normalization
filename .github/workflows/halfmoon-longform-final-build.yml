name: Final full-length Half-Moon article production and figure audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/halfmoon-longform-final-build.yml']
permissions:
  contents: write
jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify protected mathematical and experimental evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          orig=Path('submission/PRL_V11_Final/Editable_LaTeX/theory_main.tex').read_text()
          ext=Path('submission/Full_Article/Full_Theory.tex').read_text()
          pat=re.compile(r'\\begin\{(?:equation|align)\}.*?\\end\{(?:equation|align)\}',re.S)
          assert pat.findall(orig)==pat.findall(ext)
          assert re.findall(r'\\label\{([^}]+)\}',orig)==re.findall(r'\\label\{([^}]+)\}',ext)
          main=Path('submission/Full_Article/Full_Manuscript.tex').read_text()
          table=Path('submission/PRL_V11_Final/Editable_LaTeX/one_bit_experiment.tex').read_text()
          a=table.index('\\begin{table}'); b=table.index('\\end{table}',a)+len('\\end{table}')
          assert table[a:b].replace('[t]', '[H]') in main
          bib=Path('submission/PRL_V11_Final/Editable_LaTeX/references.bib').read_text()
          entries=set(re.findall(r'@\w+\s*\{\s*([^,]+)',bib))
          cites=set(x.strip() for group in re.findall(r'\\cite[pt]?\{([^}]+)\}',main+'\n'+ext) for x in group.split(','))
          assert cites <= entries, f'Unresolved bibliography keys: {cites-entries}'
          assert 'releases/tag/v11-submission' in main
          assert 'During preparation of this work, the author used Elsevier LeapSpace' in main
          print('PASS: protected math, one-bit table, references, AI statement and data release')
          PY
      - name: Compile with full TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3
            cd submission/PRL_V11_Final/Editable_LaTeX
            bash build.sh > ../../Full_Article/Supplement_Build.log 2>&1 || {
              tail -100 ../../Full_Article/Supplement_Build.log
              exit 1
            }
            cp ../../Full_Article/Full_Manuscript.tex ./Full_Manuscript.tex
            cp ../../Full_Article/Full_Theory.tex ./Full_Theory.tex
            pdflatex -interaction=nonstopmode -halt-on-error Full_Manuscript.tex > ../../Full_Article/Longform_Build.log 2>&1 || {
              tail -100 ../../Full_Article/Longform_Build.log
              exit 1
            }
            bibtex Full_Manuscript >> ../../Full_Article/Longform_Build.log 2>&1
            pdflatex -interaction=nonstopmode -halt-on-error Full_Manuscript.tex >> ../../Full_Article/Longform_Build.log 2>&1 || {
              tail -100 ../../Full_Article/Longform_Build.log
              exit 1
            }
            pdflatex -interaction=nonstopmode -halt-on-error Full_Manuscript.tex >> ../../Full_Article/Longform_Build.log 2>&1 || {
              tail -100 ../../Full_Article/Longform_Build.log
              exit 1
            }
            if grep -Ei 'LaTeX Error:|Undefined control sequence|There were undefined references|There were undefined citations|Citation .+ undefined' Full_Manuscript.log; then
              exit 1
            fi
            cp Full_Manuscript.pdf ../../Full_Article/Full_Manuscript.pdf
      - name: Verify PDF and package editable source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y poppler-utils rsync zip
          OUT=submission/Full_Article
          EDIT=submission/PRL_V11_Final/Editable_LaTeX
          PAGES=$(pdfinfo "$OUT/Full_Manuscript.pdf" | awk '/^Pages:/ {print $2}')
          echo "Full-length manuscript: $PAGES pages"
          test "$PAGES" -ge 20
          test "$PAGES" -le 35
          pdftotext "$OUT/Full_Manuscript.pdf" "$OUT/check_text.txt"
          grep -q 'Discussion' "$OUT/check_text.txt"
          grep -q '54,362' "$OUT/check_text.txt"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/Manuscript" "$TMP/Figures"
          rsync -a --include '*/' --include '*.tex' --include '*.bib' --include '*.sty' --include '*.cls' --include '*.py' --exclude '*' "$EDIT/" "$TMP/Manuscript/"
          rsync -a submission/PRL_V11_Final/Figures/ "$TMP/Figures/"
          (cd "$TMP" && zip -q -r "$GITHUB_WORKSPACE/$OUT/Full_Article_Source.zip" Manuscript Figures)
          unzip -tq "$OUT/Full_Article_Source.zip"
          rm -rf "$TMP"
          cat > "$OUT/PRODUCTION_STATUS.md" <<EOF
          # Full-length research article production record
          Compiled pages: $PAGES
          Format: 12-point, single-column, double-spaced LaTeX
          Frozen mathematical equations: verified unchanged
          One-bit experimental table: verified unchanged
          Source archive integrity: PASS
          Original PRL seven-page Journal_Upload files: unchanged
          Full-length manuscript: not yet submitted to any other journal
          Visual page inspection: pending
          EOF
          : > "$OUT/Verification/figure_locations.txt"
          for fig in 1 2; do
            for page in $(seq 1 "$PAGES"); do
              if pdftotext -f "$page" -l "$page" "$OUT/Full_Manuscript.pdf" - | grep -q "Figure $fig"; then
                pdftoppm -f "$page" -l "$page" -r 110 -singlefile -png "$OUT/Full_Manuscript.pdf" "$OUT/Verification/figure_$fig"
                printf 'Figure %s page %s\n' "$fig" "$page" >> "$OUT/Verification/figure_locations.txt"
                break
              fi
            done
          done
          mkdir -p "$OUT/Verification"
          rm -f "$OUT/Verification"/page_*.png
          for page in 1 5 12 20 27 "$PAGES"; do
            pdftoppm -f "$page" -l "$page" -r 90 -singlefile -png "$OUT/Full_Manuscript.pdf" "$OUT/Verification/page_$(printf %02d "$page")"
          done
          mkdir -p /tmp/HalfMoonLongformPreview
          pdftoppm -f 1 -l 4 -r 90 -png "$OUT/Full_Manuscript.pdf" /tmp/HalfMoonLongformPreview/page
          pdfinfo "$OUT/Full_Manuscript.pdf" | head -16
      - name: Commit outputs to the existing main branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/halfmoon-longform-final-build.yml
          rm -f submission/Full_Article/Supplement_Build.log submission/Full_Article/Longform_Build.log submission/Full_Article/check_text.txt
          git add -A -- submission/Full_Article .github/workflows/halfmoon-longform-final-build.yml
          git commit -m "Publish complete full-length Half-Moon manuscript PDF and source"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: HalfMoon-Full-Length-Manuscript-Package
          path: |
            submission/Full_Article/Full_Manuscript.pdf
            submission/Full_Article/Full_Article_Source.zip
            /tmp/HalfMoonLongformPreview/
