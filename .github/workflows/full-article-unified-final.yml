name: Unified final Half-Moon article production and reproduction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-article-unified-final.yml'
permissions:
  contents: write
jobs:
  full-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify protected original scientific content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          base=Path('submission/PRL_V11_Final/Editable_LaTeX')
          full=Path('submission/Full_Article')
          orig=(base/'theory_main.tex').read_text()
          narr=(full/'Full_Theory.tex').read_text()
          pat=re.compile(r'\\begin\{(?:equation|align)\}.*?\\end\{(?:equation|align)\}',re.S)
          assert pat.findall(orig)==pat.findall(narr),'Theorem mathematical environments changed'
          assert re.findall(r'\\label\{([^}]+)\}',orig)==re.findall(r'\\label\{([^}]+)\}',narr),'Theorem labels changed'
          ms=(full/'Full_Manuscript.tex').read_text()
          def body(source,label):
            for m in re.finditer(r'\\begin\{table\}(?:\[[^\]]+\])?.*?\\end\{table\}',source,re.S):
              if '\\label{'+label+'}' in m.group():
                return re.sub(r'\\begin\{table\}(?:\[[^\]]+\])?','\\begin{table}',m.group(),count=1)
            raise ValueError('Missing '+label)
          originals=(base/'experimental_sections.tex').read_text()
          for label in ('tab:neural-main','tab:neural-contrasts'):
            assert body(originals,label)==body(ms,label),'Results table content altered: '+label
          assert body((base/'one_bit_experiment.tex').read_text(),'tab:one-bit-neural')==body(ms,'tab:one-bit-neural'),'One-bit result table altered'
          bib=(base/'references.bib').read_text()
          bibkeys=set(re.findall(r'@\w+\s*\{\s*([^,]+)',bib))
          used=set(k.strip() for x in re.findall(r'\\cite[tp]?\{([^}]+)\}',ms+'\n'+narr) for k in x.split(','))
          assert used<=bibkeys,'Missing bibliography keys: '+repr(used-bibkeys)
          assert 'During preparation of this work, the author used Elsevier LeapSpace' in ms
          assert 'releases/tag/v11-submission' in ms
          print('PASS: Frozen theorem equations, labels, 3 evidence tables, bibliography keys, AI statement')
          PY
      - name: Compile, zip and clean-room reproduce with full TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3 poppler-utils rsync zip unzip
            ROOT="$GITHUB_WORKSPACE"
            EDIT="$ROOT/submission/PRL_V11_Final/Editable_LaTeX"
            OUT="$ROOT/submission/Full_Article"
            mkdir -p "$OUT/Verification"
            cd "$EDIT"
            bash build.sh > "$OUT/Verification/main_build_log.txt" 2>&1 || {
              tail -100 "$OUT/Verification/main_build_log.txt"
              exit 1
            }
            cp "$OUT/Full_Manuscript.tex" ./Full_Manuscript.tex
            cp "$OUT/Full_Theory.tex" ./Full_Theory.tex
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex > "$OUT/Verification/full_article_build_log.txt" 2>&1 || {
              tail -100 "$OUT/Verification/full_article_build_log.txt"
              exit 1
            }
            bibtex Full_Manuscript >> "$OUT/Verification/full_article_build_log.txt" 2>&1
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$OUT/Verification/full_article_build_log.txt" 2>&1
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$OUT/Verification/full_article_build_log.txt" 2>&1
            if grep -Ei 'LaTeX Error:|Undefined control sequence|There were undefined references|There were undefined citations|Citation .+ undefined' Full_Manuscript.log; then
              exit 1
            fi
            cp Full_Manuscript.pdf "$OUT/Full_Manuscript.pdf"
            COUNT=$(pdfinfo Full_Manuscript.pdf | awk '/^Pages:/ {print $2}')
            test "$COUNT" -ge 20 && test "$COUNT" -le 35
            echo "PASS: Full article $COUNT pages"
            TMP=$(mktemp -d)
            mkdir -p "$TMP/Manuscript" "$TMP/Figures"
            rsync -a --include '*/' --include '*.tex' --include '*.bib' --include '*.cls' --include '*.sty' --include '*.py' --include '*.sh' --exclude '*' "$EDIT/" "$TMP/Manuscript/"
            rsync -a "$ROOT/submission/PRL_V11_Final/Figures/" "$TMP/Figures/"
            (cd "$TMP" && zip -q -r "$OUT/Full_Article_Source.zip" Manuscript Figures)
            unzip -tq "$OUT/Full_Article_Source.zip"
            for item in Manuscript/build.sh Manuscript/Full_Manuscript.tex Manuscript/Full_Theory.tex Manuscript/Supplement.tex Manuscript/references.bib Figures/Fig1_Geometry.pdf Figures/Fig2_One_Bit_Recovery.pdf; do
              unzip -Z1 "$OUT/Full_Article_Source.zip" | grep -Fx "$item" >/dev/null
            done
            CLEAN=$(mktemp -d)
            unzip -q "$OUT/Full_Article_Source.zip" -d "$CLEAN"
            cd "$CLEAN/Manuscript"
            bash build.sh > "$OUT/Verification/clean_zip_build_log.txt" 2>&1 || {
              tail -100 "$OUT/Verification/clean_zip_build_log.txt"
              exit 1
            }
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$OUT/Verification/clean_zip_build_log.txt" 2>&1
            bibtex Full_Manuscript >> "$OUT/Verification/clean_zip_build_log.txt" 2>&1
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$OUT/Verification/clean_zip_build_log.txt" 2>&1
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$OUT/Verification/clean_zip_build_log.txt" 2>&1
            test "$(pdfinfo Full_Manuscript.pdf | awk '/^Pages:/ {print $2}')" = "$COUNT"
            pdftotext -layout Full_Manuscript.pdf "$CLEAN/rebuilt.txt"
            pdftotext -layout "$OUT/Full_Manuscript.pdf" "$CLEAN/published.txt"
            diff -q "$CLEAN/rebuilt.txt" "$CLEAN/published.txt"
            echo "PASS: clean source archive independently rebuilds $COUNT-page manuscript with identical PDF text"
            cat > "$OUT/Verification/CLEAN_ZIP_REBUILD.txt" <<EOF
            Clean extracted-source rebuild: PASS
            Independent extraction under temporary root: PASS
            Supplement and long-form LaTeX compilation: PASS
            Rebuilt page count: $COUNT
            Pages match published PDF: PASS
            pdftotext -layout identical to published PDF: PASS
            Source ZIP verified: Full_Article_Source.zip
            EOF
            cat > "$OUT/PRODUCTION_STATUS.md" <<EOF
            # Half-Moon full-length article — synchronized final production
            Main article: $COUNT pages (12-point, single-column, double-spaced)
            Full LaTeX compilation: PASS
            Source/math/label/result table preservation: PASS
            Citation-key resolution: PASS
            Source ZIP complete and integrity-checked: PASS
            Source ZIP independent clean-room compilation: PASS
            Rebuilt PDF page count and text equality: PASS
            Original PRL Journal_Upload unchanged: PASS
            Final visual page-by-page inspection: PENDING
            Independent external scientific peer review: NOT VERIFIED
            Full-length journal submission: NOT PERFORMED
            EOF
            rm -rf "$TMP" "$CLEAN"
      - name: Regenerate final full-page PDF audit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y poppler-utils
          FILE=submission/Full_Article/Full_Manuscript.pdf
          AUDIT=submission/Full_Article/Verification/Full_Page_Audit
          mkdir -p "$AUDIT/png" "$AUDIT/text"
          rm -f "$AUDIT"/png/page_*.png "$AUDIT"/text/page_*.txt
          N=$(pdfinfo "$FILE" | awk '/^Pages:/ {print $2}')
          printf 'page\twords\tlines\tcharacters\n' > "$AUDIT/page_metrics.tsv"
          for p in $(seq 1 "$N"); do
            nn=$(printf '%02d' "$p")
            pdftoppm -f "$p" -l "$p" -r 85 -singlefile -png "$FILE" "$AUDIT/png/page_$nn"
            pdftotext -f "$p" -l "$p" -layout "$FILE" "$AUDIT/text/page_$nn.txt"
            test -s "$AUDIT/png/page_$nn.png" && test -s "$AUDIT/text/page_$nn.txt"
            printf '%s\t%s\t%s\t%s\n' "$p" "$(wc -w < "$AUDIT/text/page_$nn.txt" | tr -d ' ')" "$(wc -l < "$AUDIT/text/page_$nn.txt" | tr -d ' ')" "$(wc -m < "$AUDIT/text/page_$nn.txt" | tr -d ' ')" >> "$AUDIT/page_metrics.tsv"
          done
          test "$(find "$AUDIT/png" -name 'page_*.png' | wc -l | tr -d ' ')" = "$N"
          git diff --quiet -- submission/PRL_V11_Final/Journal_Upload
          echo "PASS: $N source-matched pages rendered; original PRL package unchanged"
      - name: Publish only synchronized full-article output on main
        shell: bash
        run: |
          set -euo pipefail
          rm -f submission/Full_Article/Verification/*_build_log.txt
          rm -f .github/workflows/full-article-unified-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- submission/Full_Article .github/workflows/full-article-unified-final.yml
          git diff --cached --quiet && { echo 'Nothing updated'; exit 1; }
          git commit -m "Synchronize final full-length manuscript PDF and clean-room source archive"
          git push origin HEAD:main
