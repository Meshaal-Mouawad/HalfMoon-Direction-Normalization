name: One-time clean-room LaTeX source archive reproducibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-article-zip-reproduction.yml'
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Compile from extracted source ZIP in a clean directory
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          scheme: full
          run: |
            set -euo pipefail
            apt-get -qq update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y python3 unzip poppler-utils
            mkdir -p /tmp/HalfMoonStandalone
            unzip -q "$GITHUB_WORKSPACE/submission/Full_Article/Full_Article_Source.zip" -d /tmp/HalfMoonStandalone
            cd /tmp/HalfMoonStandalone/Manuscript
            bash build.sh > "$GITHUB_WORKSPACE/submission/Full_Article/Verification/clean_zip_build.log" 2>&1 || {
              tail -100 "$GITHUB_WORKSPACE/submission/Full_Article/Verification/clean_zip_build.log"
              exit 1
            }
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$GITHUB_WORKSPACE/submission/Full_Article/Verification/clean_zip_build.log" 2>&1
            bibtex Full_Manuscript >> "$GITHUB_WORKSPACE/submission/Full_Article/Verification/clean_zip_build.log" 2>&1
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$GITHUB_WORKSPACE/submission/Full_Article/Verification/clean_zip_build.log" 2>&1
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error Full_Manuscript.tex >> "$GITHUB_WORKSPACE/submission/Full_Article/Verification/clean_zip_build.log" 2>&1
            pdfinfo Full_Manuscript.pdf | grep '^Pages:'
            test "$(pdfinfo Full_Manuscript.pdf | awk '/^Pages:/ {print $2}')" = "$(pdfinfo "$GITHUB_WORKSPACE/submission/Full_Article/Full_Manuscript.pdf" | awk '/^Pages:/ {print $2}')"
            pdftotext -layout Full_Manuscript.pdf /tmp/standalone_text.txt
            pdftotext -layout "$GITHUB_WORKSPACE/submission/Full_Article/Full_Manuscript.pdf" /tmp/published_text.txt
            diff -q /tmp/standalone_text.txt /tmp/published_text.txt || {
              echo "STOP: standalone archive differs in extracted PDF text"
              exit 1
            }
            echo "PASS: independent ZIP extraction, supplement build, long-form build and page/text equivalence"
      - name: Record reproduction receipt; delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > submission/Full_Article/Verification/CLEAN_ZIP_REBUILD.txt <<EOF
          Clean source archive reproducibility: PASS
          Source: submission/Full_Article/Full_Article_Source.zip
          Procedure: unzip into new /tmp directory, bash build.sh, pdflatex + bibtex + pdflatex twice on Full_Manuscript.tex
          Supplement and manuscript compilation from ZIP: PASS
          Page count equals published Full_Manuscript.pdf: PASS
          PDF text (pdftotext -layout) identical to published Full_Manuscript.pdf: PASS
          External journal submission: NOT PERFORMED
          EOF
          rm -f .github/workflows/full-article-zip-reproduction.yml
          rm -f submission/Full_Article/Verification/clean_zip_build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- submission/Full_Article/Verification .github/workflows/full-article-zip-reproduction.yml
          git commit -m "Verify full-length LaTeX source archive builds independently"
          git push origin HEAD:main
